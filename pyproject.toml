[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-virtual-flush-meter"
version = "0.4.0"
description = "Home Assistant integration that counts toilet flushes and estimates flushed water from a single bowl temperature probe"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "rambobinator"}]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "C4",   # flake8-comprehensions
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
